
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA Photos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b16;color:#f5f5ff;font-family:Arial,sans-serif;padding:24px;max-width:900px;margin:auto}
h1{font-size:32px}h1 span{color:#7ce7d4}.card{background:#151a2d;border:1px solid #303650;border-radius:18px;padding:20px;margin:18px 0}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #343b59;background:#0b1020;color:white;font-size:15px}
button{background:#8173ff;border:0;font-weight:bold}p{color:#b6bfd8;line-height:1.5}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{overflow:hidden;background:#151a2d;border-radius:12px;padding:8px;overflow-wrap:anywhere}.tile img,.tile video{width:100%;height:140px;object-fit:cover}
.small{font-size:12px}
</style>
</head>
<body>
<h1>NEXORA <span>Photos</span></h1>
<p>Simpan kenanganmu. Semua foto dalam satu tempat pribadi.</p>

<div class="card">
<h3>Hubungkan Supabase</h3>
<input id="url" placeholder="Project URL">
<input id="key" placeholder="Publishable key">
<button onclick="connect()">Hubungkan</button>
<p id="status">Masukkan URL dan Publishable key kamu.</p>
</div>

<div class="card">
<h3>Akun kamu</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Daftar akun</button>
<button onclick="login()">Masuk</button>
<button onclick="logout()">Keluar</button>
<p id="authstatus">Hubungkan Supabase terlebih dahulu.</p>
</div>

<div class="card">
<h3>Penyimpanan foto & video</h3>
<input id="files" type="file" accept="image/*,video/*" multiple>
<button onclick="upload()">Upload file</button>
<p id="uploadstatus"></p>
<div id="gallery" class="gallery"></div>
</div>

<script>
let db=null,user=null;
const $=id=>document.getElementById(id);
function msg(id,t){$(id).textContent=t}
async function connect(){
 const url=$('url').value.trim(),key=$('key').value.trim();
 if(!url||!key)return msg('status','Isi kedua kolom terlebih dahulu.');
 try{
  db=window.supabase.createClient(url,key);
  const {error}=await db.auth.getSession();
  if(error)throw error;
  msg('status','Supabase berhasil dihubungkan.');
  await session();
 }catch(e){db=null;msg('status','Gagal: '+e.message)}
}
async function session(){
 if(!db)return;
 const {data}=await db.auth.getSession();
 user=data.session?.user||null;
 msg('authstatus',user?'Login: '+user.email:'Silakan daftar atau masuk.');
 if(user)await load();
}
async function signup(){
 if(!db)return msg('authstatus','Hubungkan Supabase dahulu.');
 const {data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});
 if(error)return msg('authstatus',error.message);
 if(!data.session)return msg('authstatus','Cek email untuk konfirmasi akun, lalu masuk.');
 await session();
}
async function login(){
 if(!db)return msg('authstatus','Hubungkan Supabase dahulu.');
 const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 if(error)return msg('authstatus',error.message);
 await session();
}
async function logout(){
 if(db)await db.auth.signOut();
 user=null;$('gallery').innerHTML='';
 msg('authstatus','Kamu sudah keluar.');
}
async function upload(){
 if(!db||!user)return msg('uploadstatus','Hubungkan Supabase dan login dahulu.');
 const files=[...$('files').files];
 if(!files.length)return msg('uploadstatus','Pilih foto atau video dahulu.');
 for(const f of files){
  msg('uploadstatus','Mengunggah '+f.name+'...');
  const path=user.id+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_');
  const {error:e}=await db.storage.from('PHOTO').upload(path,f);
  if(e)return msg('uploadstatus','Upload gagal: '+e.message);
  const {error:r}=await db.from('photos').insert({user_id:user.id,file_name:f.name,file_path:path,file_size:f.size});
  if(r)return msg('uploadstatus','File terunggah, tetapi catatan gagal: '+r.message);
 }
 $('files').value='';
 msg('uploadstatus','Upload selesai!');
 await load();
}
async function load(){
 const {data,error}=await db.from('photos').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
 if(error)return msg('uploadstatus','Gagal memuat file: '+error.message);
 $('gallery').innerHTML='';
 for(const f of data){
  const {data:s,error:e}=await db.storage.from('PHOTO').createSignedUrl(f.file_path,3600);
  const tile=document.createElement('div');tile.className='tile';
  if(!e&&s){
   const media=document.createElement(/\.(mp4|mov|webm)$/i.test(f.file_name)?'video':'img');
   media.src=s.signedUrl;
   if(media.tagName==='VIDEO')media.controls=true;
   tile.appendChild(media);
  }
  const name=document.createElement('p');name.className='small';name.textContent=f.file_name;tile.appendChild(name);
  $('gallery').appendChild(tile);
 }
}
</script>
</body>
</html>
